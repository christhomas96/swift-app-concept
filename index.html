:root{
  --navy:#002652;--blue:#0039A6;--sky:#007ACC;--mist:#ECF7FF;--teal:#00B299;--amber:#FFA100;--pink:#E06793;
  --bg:#F7FAFD;--card:#fff;--ink:#14233A;--muted:#4A5B73;--line:#D5E0EC;--accent:#0039A6;--accent-ink:#fff;--soft:#ECF7FF;--hi:#FFE08A;--hi-ink:#14233A;
  --font:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--mist);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.page{display:grid;grid-template-columns:minmax(320px,440px) auto;justify-content:center;gap:56px;height:100%;padding:24px 32px;align-items:center}

/* Side panel */
.side{max-height:calc(100vh - 48px);overflow:auto;padding:4px 12px 4px 4px;color:#14233A}
.side .logo svg{height:44px;width:auto;display:block;color:#1A1A1A}
.side h1{font-size:30px;line-height:1.2;color:var(--navy);margin:20px 0 8px}
.side>p{font-size:17px;color:#33445C}
.about h2{font-size:17px;color:var(--navy);margin:24px 0 8px}
.about ol,.about ul{padding-left:22px;font-size:16px}
.about li{margin:6px 0}
.about p{font-size:16px}
.about .fine{font-size:14.5px;color:var(--muted);margin-top:8px}
.tour{display:grid;gap:8px;list-style:none;padding:0!important}
.tour button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;background:#fff;border:1.5px solid #D5E0EC;border-radius:12px;font-size:16px;color:#14233A}
.tour button:hover{border-color:var(--sky)}
.tour b{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px}

/* Phone */
.phone{width:390px;height:min(830px,calc(100vh - 48px));border-radius:42px;background:#0B1A2E;padding:10px;box-shadow:0 24px 60px rgba(0,38,82,.28)}
.app{--s:1;position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;border-radius:33px;background:var(--bg);color:var(--ink);font-size:calc(17px*var(--s))}
.app[data-tint=cream]{--bg:#F6EFDD;--card:#FDF9EE;--ink:#2A2418;--muted:#5D543F;--line:#E2D8BE;--soft:#F1E7CD}
.app[data-tint=blue]{--bg:#D9E9F6;--card:#EEF6FC;--ink:#10243B;--muted:#3C526C;--line:#BDD3E6;--soft:#DCEBF7}
.app[data-tint=dark]{--bg:#0E1826;--card:#18263A;--ink:#EAF1F8;--muted:#A9B8CA;--line:#2F415B;--accent:#8CC2FF;--accent-ink:#06172B;--soft:#1F3552}
.app.wide{letter-spacing:.035em;word-spacing:.14em;line-height:1.72}
.strip{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 18px 7px;background:var(--navy);color:#fff;font-size:13px;line-height:1.25;letter-spacing:0;word-spacing:0}
.strip button{flex:none;text-decoration:underline;color:#fff;padding:2px 0}
.top{flex:none;display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 12px 8px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.top .logo svg{height:34px;width:auto;display:block}
.top h1{flex:1;min-width:0;font-size:1.06em;line-height:1.2}
.top .sp{flex:1}
.icbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;position:relative;flex:none}
.icbtn:hover{background:var(--soft)}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid var(--card)}
.ic{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top .ic{width:24px;height:24px}
.logout{flex:none;display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 8px;border-radius:12px;font-size:14px;font-weight:700;line-height:1.1;letter-spacing:0;word-spacing:0;white-space:nowrap}
.logout:hover{background:var(--soft)}
.logout .ic{width:20px;height:20px}
.homebtn{display:block;border-radius:8px}
.aa{font-weight:700;font-size:20px;letter-spacing:0;word-spacing:0}
.view{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 12px}
.tabs button{display:grid;justify-items:center;gap:2px;padding:7px 2px 5px;border-radius:12px;color:var(--muted);font-size:13px;line-height:1.15;letter-spacing:0;word-spacing:0;text-align:center}
.tabs .ic{width:24px;height:24px}
.tabs [aria-current=page]{color:var(--accent);font-weight:700;background:var(--soft)}

/* Blocks */
h2.h{font-size:1.2em;line-height:1.25;margin:24px 0 10px}
h2.h:first-child{margin-top:0}
.hello{font-size:1.45em;font-weight:700;line-height:1.2}
.sub{color:var(--muted)}
.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
button.card:hover{border-color:var(--sky)}
.row{display:flex;gap:12px;align-items:center;width:100%}
.row .grow{flex:1;min-width:0}
.t{font-weight:700;line-height:1.3}
.d{color:var(--muted);font-size:.94em;line-height:1.4}
.chev{color:var(--muted);width:20px;height:20px}
.tile-ic{display:grid;place-items:center;flex:none;width:2.5em;height:2.5em;border-radius:12px;background:var(--soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{display:grid;gap:8px;align-content:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:700;line-height:1.25}
.tile:hover{border-color:var(--sky)}
.tile .sw{display:grid;place-items:center;width:2.3em;height:2.3em;border-radius:11px;color:#04203F}
.bg-teal{background:#7FE0CF}.bg-amber{background:#FFD27A}.bg-pink{background:#F5BDD1}.bg-sky{background:#A9DAF8}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8em;font-weight:700;line-height:1.5;background:var(--soft);color:var(--ink);letter-spacing:0;word-spacing:0}
.tag.new{background:#FFD27A;color:#04203F}
.tag.urgent{background:#F5BDD1;color:#04203F}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:.94em;line-height:1.2}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;line-height:1.25}
.btn.alt{background:var(--card);border:1.5px solid var(--accent);color:var(--accent)}
.btn+.btn{margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.listen{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:6px 14px;border-radius:999px;background:var(--soft);color:var(--ink);font-weight:700;font-size:.94em}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.97em}
.note .t{margin-bottom:4px}
.bul{padding-left:1.15em}
.bul li{margin:5px 0}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero .t{font-size:1.35em;line-height:1.2}
.hero p{margin-top:8px;color:#D9E9F6}
.hero .tag{background:#FFD27A;color:#04203F}
.hero .listen{background:#fff;color:#002652}

/* Day card */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.week button{display:grid;justify-items:center;padding:6px 0;border-radius:11px;font-size:.84em;line-height:1.25;color:var(--muted);letter-spacing:0;word-spacing:0}
.week b{font-size:1.15em;color:var(--ink)}
.week [aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.week [aria-pressed=true] b{color:var(--accent-ink)}
.times{display:grid;gap:7px;margin:10px 0}
.times div{display:flex;justify-content:space-between;gap:12px}
.times b{white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* Calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;letter-spacing:0;word-spacing:0}
.mgrid span{font-size:.8em;color:var(--muted);padding-bottom:4px}
.mgrid button{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:.92em;text-align:center}
.mgrid .ev::after{content:"";position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--sky)}
.mgrid .off{background:var(--soft)}
.mgrid .off::after{background:var(--pink)}
.mgrid .now{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.mgrid [aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.datebox{flex:none;display:grid;justify-items:center;width:3.1em;padding:5px 0;border-radius:12px;background:var(--soft);line-height:1.15;letter-spacing:0;word-spacing:0}
.datebox small{font-size:.74em;color:var(--muted)}
.datebox b{font-size:1.2em}

/* Newsletters */
.search{display:flex;align-items:center;gap:9px;padding:0 14px;min-height:48px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
.search input::placeholder{color:var(--muted);opacity:1}
.feat{background:var(--navy);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.feat .t{font-size:1.25em;margin:7px 0 2px}
.feat .d{color:#CFE3F4}
.feat ul{padding-left:1.1em;margin:10px 0 12px;color:#fff}
.feat li{margin:4px 0}
.feat .btns{display:flex;gap:8px;flex-wrap:wrap}
.feat .read{flex:1;min-width:7em;min-height:44px;border-radius:12px;background:#fff;color:#002652;font-weight:700;text-align:center;padding:6px 12px}
.feat .listen{flex:1;min-width:7em;justify-content:center;background:#1A4777;color:#fff;border-radius:12px}
.month{margin:18px 0 8px;font-weight:700;color:var(--muted);font-size:.94em}
.reader h2{font-size:1.45em;line-height:1.2;margin:8px 0 2px}
.reader h3{font-size:1.1em;margin:20px 0 6px}
.reader p{margin:8px 0}
.do{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 0}
.box{flex:none;display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:7px;border:2px solid var(--muted);color:transparent}
.box .ic{width:1em;height:1em;stroke-width:3}
[aria-checked=true] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.w.on{background:var(--hi);color:var(--hi-ink);border-radius:3px;box-shadow:0 0 0 2px var(--hi)}
.reading{background:color-mix(in srgb,var(--hi) 22%,transparent);border-radius:6px}

/* Forms */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:11px 14px;margin-bottom:10px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;line-height:1.25}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.86em}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:6px 0 16px}
.seg button{min-height:46px;padding:4px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:center;font-weight:700;font-size:.9em;line-height:1.15}
.seg [aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 0}
.switch i{flex:none;position:relative;width:50px;height:30px;border-radius:15px;background:var(--line)}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{left:23px}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;padding-left:12px}
tr:last-child td{border:0}
.tl{list-style:none;padding:0;counter-reset:s}
.tl li{position:relative;padding:0 0 16px 46px;counter-increment:s}
.tl li::before{content:counter(s);position:absolute;left:0;top:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;letter-spacing:0}
.tl li:not(:last-child)::after{content:"";position:absolute;left:15px;top:36px;bottom:4px;width:2px;background:var(--line)}
.ok{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 8px 16px}
.ok .sw{display:grid;place-items:center;width:4em;height:4em;border-radius:50%;background:#7FE0CF;color:#04203F}
.welcome{display:flex;flex-direction:column;gap:6px;min-height:100%}
.welcome .logo svg{height:60px;width:auto;display:block;margin:10px 0 18px}

/* Overlays */
.player{flex:none;display:none;align-items:center;gap:8px;padding:7px 8px 7px 16px;background:var(--navy);color:#fff;font-size:15px;letter-spacing:0;word-spacing:0}
.player.on{display:flex}
.player span{flex:1}
.player .icbtn:hover{background:#17406E}
.scrim{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,20,45,.5)}
.sheet{max-height:88%;overflow:auto;padding:20px 18px 26px;border-radius:22px 22px 0 0;background:var(--card);color:var(--ink)}
.sheet h2{font-size:1.2em;line-height:1.25;margin-bottom:6px}
.sheet .btn{margin-top:14px}
.sheet.about h2{margin-top:18px}
.sheet.about h2:first-child{margin-top:0}
.toast{position:absolute;left:14px;right:14px;bottom:92px;z-index:30;padding:12px 16px;border-radius:14px;background:#0B1A2E;color:#fff;font-size:15px;line-height:1.35;letter-spacing:0;word-spacing:0;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .page{display:block;padding:0;height:100dvh}
  .side{display:none}
  .phone{width:100%;height:100dvh;padding:0;border-radius:0;box-shadow:none;background:none}
  .app{border-radius:0}
  .tabs{padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .strip{padding-top:max(8px,env(safe-area-inset-top))}
}
@media (min-width:901px){.strip .only-m{display:none}}
</style>

  <div class="card" style="padding:4px 16px"><table>${[['Galaxy','$15,000 and up'],['Interstellar','$10,000 to $14,999'],['Celestial','$5,000 to $9,999'],['Constellation','$2,500 to $4,999'],['Meteor','$1,500 to $2,499'],['Astronomer','Up to $1,499']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
  <h2 class="h">Georgia GOAL tax credit</h2>
  <div class="card"><div class="d">Up to $2,500 for individuals. Up to $5,000 for joint filers.</div></div>`}
};

/* ---------- List helpers ---------- */
function nlList(){
 const q=S.nlQ.trim().toLowerCase();
 let items=ISSUES.filter(i=>S.nlKind==='all'||(S.nlKind==='saved'?S.saved[i.id]:i.kind===S.nlKind));
 if(q)items=items.filter(i=>[i.title,NL[i.kind],...i.short,...i.body.flat()].join(' ').toLowerCase().includes(q));
 if(!items.length)return `<p class="sub" style="padding:10px 2px">${S.nlKind==='saved'&&!q?'Nothing saved yet. Tap Save on any newsletter.':'No newsletters match that.'}</p>`;
 let html='',rest=items;
 const f=items[0];
 if(f.fresh&&!q){rest=items.slice(1);html+=`<section class="feat"><span class="tag new">New this week</span><div class="t">${f.title}</div><ul>${f.short.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="btns"><button class="read" data-a="issue" data-x="${f.id}">Read</button><button class="listen" data-a="issueListen" data-x="${f.id}">${I("vol")}Listen</button></div></section>`}
 let mo='';rest.forEach(i=>{const m=fmt(i.date,{month:'long',year:'numeric'});if(m!==mo){html+=`<div class="month">${m}</div>`;mo=m}html+=issueRow(i)});
 return html;
}
function helpList(){
 const q=S.helpQ.trim().toLowerCase();
 const t=TOPICS.filter(x=>!q||(x.title+' '+x.kw+' '+x.body.join(' ')).toLowerCase().includes(q));
 return `${t.length?t.map(x=>rowCard('topic',x.id,x.icon,x.title,'')).join(''):'<p class="sub">No match. Try another word.</p>'}
 ${q?'':`<h2 class="h">School apps</h2>${Object.entries(APPS).map(([k,v])=>`<button class="card" data-a="app" data-x="${k}"><span class="row"><span class="tile-ic">${I(v.icon)}</span><span class="grow t">${v.name}</span>${I('out','chev')}</span></button>`).join('')}`}
 <button class="btn alt" style="margin-top:8px" data-a="contact" data-x="Front desk">${I('phone')}Call the school</button>`;
}

/* ---------- Rendering ---------- */
function applyPrefs(){const a=$('#app');a.style.setProperty('--s',prefs.size);a.dataset.tint=prefs.tint;a.classList.toggle('wide',!!prefs.wide);save('swift-prefs',prefs)}
function render(keep){
 stopTTS();
 const v=$('#view'),y=v.scrollTop,cur=curScreen(),sc=SCREENS[cur.s];
 const root=S.stack.length===1;
 if(cur.s==='welcome')$('#top').style.display='none';else $('#top').style.display='';
 const out=S.persona?`<button class="logout" data-a="logout">${I('logout')}Log out</button>`:'';
 $('#top').innerHTML=root?`<button class="logo homebtn" data-a="home" aria-label="Swift School, go to home">${LOGO}</button><span class="sp"></span>
   <button class="icbtn" data-a="go" data-x="comfort" aria-label="Reading comfort"><span class="aa">Aa</span></button>
   ${S.persona==='family'?`<button class="icbtn" data-a="go" data-x="alerts" aria-label="Alerts">${I('bell')}<span class="dot"></span></button>`:''}${out}`
  :`<button class="icbtn" data-a="back" aria-label="Back">${I('left')}</button><h1>${sc.title}</h1>${out}`;
 v.innerHTML=sc.html(cur.p||{});
 const tabs=S.persona?TABS[S.persona]:null;
 $('#tabs').style.display=tabs?'':'none';
 if(tabs)$('#tabs').innerHTML=tabs.map(([id,l,ic])=>`<button data-a="tab" data-x="${id}" ${S.stack[0].s===id?'aria-current="page"':''}>${I(ic)}<span>${l}</span></button>`).join('');
 v.scrollTop=keep?y:(cur.y||0);
}
const push=(s,p)=>{curScreen().y=$('#view').scrollTop;S.stack.push({s,p});render()};
const setRoot=s=>{S.stack=[{s}];render()};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3400)}
function sheet(html,cls=''){closeSheet();const d=document.createElement('div');d.className='scrim';d.id='scrim';d.innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;$('#app').appendChild(d);d.addEventListener('click',e=>{if(e.target===d)closeSheet()});const f=d.querySelector('button');if(f)f.focus()}
function closeSheet(){const d=$('#scrim');if(d)d.remove()}

/* ---------- Read aloud ---------- */
const tts={q:[],i:0,on:false,paused:false};
function wrap(el){
 if(!el.querySelector('.w')){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())if(w.currentNode.textContent.trim())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(tk=>{if(!tk)return;if(/^\s+$/.test(tk))f.append(tk);else{const s=document.createElement('span');s.className='w';s.textContent=tk;f.append(s)}});n.replaceWith(f)})}
 let text='',words=[];el.querySelectorAll('.w').forEach(s=>{words.push({at:text.length,el:s});text+=s.textContent+' '});
 return {el,text,words};
}
function listen(sel){
 if(!('speechSynthesis' in window))return toast('This browser has no read-aloud voice. The real app would use the phone voice.');
 stopTTS();const root=$('#view').querySelector(sel);if(!root)return;
 const blocks=[...root.querySelectorAll('[data-r]')];
 tts.q=(blocks.length?blocks:[root]).map(wrap).filter(b=>b.text.trim());tts.i=0;tts.on=true;tts.paused=false;
 $('#player').classList.add('on');ttsIcon();setTimeout(speakNext,60);
}
function speakNext(){
 if(!tts.on||tts.paused)return;
 if(tts.i>=tts.q.length)return stopTTS();
 const b=tts.q[tts.i];b.el.classList.add('reading');
 const u=new SpeechSynthesisUtterance(b.text);u.rate=RATE[prefs.rate];u.lang='en-US';
 u.onboundary=e=>{if(e.name&&e.name!=='word')return;let m=null;for(const w of b.words){if(w.at<=e.charIndex)m=w;else break}
  document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));if(m){m.el.classList.add('on');const v=$('#view').getBoundingClientRect(),r=m.el.getBoundingClientRect();if(r.bottom>v.bottom-20||r.top<v.top+20)m.el.scrollIntoView({block:'center',behavior:'smooth'})}};
 const done=()=>{if(tts.cur!==u)return;b.el.classList.remove('reading');document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));tts.i++;speakNext()};
 tts.cur=u;u.onend=done;u.onerror=done;speechSynthesis.speak(u);
}
function ttsIcon(){$('#ttsBtn').innerHTML=I(tts.paused?'play':'pause');$('#ttsBtn').setAttribute('aria-label',tts.paused?'Resume':'Pause');$('#ttsStop').innerHTML=I('stop')}
function stopTTS(){tts.on=false;tts.paused=false;tts.cur=null;if('speechSynthesis' in window)speechSynthesis.cancel();$('#player').classList.remove('on');document.querySelectorAll('.reading').forEach(x=>x.classList.remove('reading'));document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'))}

/* ---------- Calendar file ---------- */
function ics(id){
 const e=EVENTS.find(x=>x.id===id),d=s=>s.replace(/-/g,'');
 const pad=n=>String(n).padStart(2,'0');
 let when;
 if(e.h)when=`DTSTART;TZID=America/New_York:${d(e.start)}T${pad(e.h[0])}${pad(e.h[1])}00\r\nDTEND;TZID=America/New_York:${d(e.start)}T${pad(e.h[2])}${pad(e.h[3])}00`;
 else{const end=new Date((e.end||e.start)+'T12:00');end.setDate(end.getDate()+1);when=`DTSTART;VALUE=DATE:${d(e.start)}\r\nDTEND;VALUE=DATE:${end.getFullYear()}${pad(end.getMonth()+1)}${pad(end.getDate())}`}
 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Swift App Concept//EN','BEGIN:VEVENT',`UID:${id}@swift-concept`,`DTSTAMP:20261105T120000Z`,when,`SUMMARY:${e.title}`,e.place?`LOCATION:${e.place.replace(/,/g,'\\,')}`:'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download=id+'.ics';document.body.append(a);a.click();a.remove();
 toast('Calendar file saved. Open it to add the event.');
}

 <ol class="tour">

  <li><button data-a="tour" data-x="absence"><b>2</b>Report an absence</button></li>
  <li><button data-a="tour" data-x="comfort"><b>3</b>Change reading comfort</button></li>
  <li><button data-a="tour" data-x="wed"><b>4</b>See a late start Wednesday</button></li>
  <li><button data-a="tour" data-x="explore"><b>5</b>View as a new family</button></li>
 </ol>
 <p class="fine">Unofficial concept, not reviewed or endorsed by Swift School. Sample family and newsletters. School details are from theswiftschool.org, November 3, 2026. Buttons send nothing.</p>`}

/* ---------- Actions ---------- */
const go=(tab)=>setRoot(tab);
const ACT={
 persona:x=>{S.persona=x;setRoot(TABS[x][0][0])},
 logout:()=>{closeSheet();S.persona=null;S.day=3;S.kid='maya';S.nlKind='all';S.nlQ='';S.helpQ='';S.calDay=null;S.calCat='all';S.calMonth=10;S.stack=[{s:'welcome'}];render();toast('Logged out.')},
 home:()=>setRoot(TABS[S.persona][0][0]),
 tab:x=>{const t=TABS[S.persona].some(r=>r[0]===x);if(t)setRoot(x);else push(x)},
 go:x=>push(x),
 back:()=>{S.stack.pop();render()},
 kid:x=>{S.kid=x;render(true)},
 day:x=>{S.day=+x;render(true)},
 todo:x=>{S.done[x]=!S.done[x];render(true)},
 issue:x=>push('issue',{id:x}),
 issueListen:x=>{push('issue',{id:x});listen('#reader')},
 saveIssue:x=>{S.saved[x]=!S.saved[x];render(true);toast(S.saved[x]?'Saved. Find it under Saved in Newsletters.':'Removed from Saved.')},
 nlKind:x=>{S.nlKind=x;render(true)},
 event:x=>push('event',{id:x}),
 topic:x=>push('topic',{id:x}),
 xp:x=>push('xp',{id:x}),
 calMonth:x=>{S.calMonth+= +x;S.calDay=null;render(true)},
 calDay:x=>{S.calDay=S.calDay===x?null:x;render(true)},
 calCat:x=>{S.calCat=x;render(true)},
 ics:x=>ics(x),
 remind:x=>{S.remind[x]=!S.remind[x];render(true)},
 notif:x=>{S.notif[x]=!S.notif[x];render(true)},
 pref:(x,el)=>{const k=el.dataset.k;prefs[k]=k==='size'?+x:x;applyPrefs();render(true)},
 wide:()=>{prefs.wide=!prefs.wide;applyPrefs();render(true)},
 listen:x=>listen(x),
 ttsToggle:()=>{tts.paused=!tts.paused;tts.cur=null;speechSynthesis.cancel();if(!tts.paused)setTimeout(speakNext,60);ttsIcon()},
 ttsStop:()=>stopTTS(),
 startAbs:()=>{S.abs={step:1,kids:[S.kid],type:null,day:null};push('absence')},
 absKid:x=>{const k=S.abs.kids;k.includes(x)?k.splice(k.indexOf(x),1):k.push(x);render(true)},
 absNext:()=>{S.abs.step=2;render()},
 absType:x=>{S.abs.type=x;S.abs.step=3;render()},
 absDay:x=>{S.abs.day=x;S.abs.step=4;render()},
 absSend:()=>{S.abs.step=5;render()},
 startBook:()=>{S.book={n:1,g:null,done:false};push('book')},
 bookN:x=>{S.book.n=+x;render(true)},
 bookG:x=>{S.book.g=x;render(true)},
 bookGo:()=>{S.book.done=true;render()},
 app:x=>sheet(`<h2>${APPS[x].name}</h2><p>The real app opens ${APPS[x].name} here.</p><button class="btn" data-a="closeSheet">Got it</button>`),
 contact:x=>sheet(`<h2>Contact: ${x}</h2><p>Demo only. No one is contacted.</p><button class="btn" data-a="closeSheet">Got it</button>`),
 giveOut:()=>sheet(`<h2>Give on the website</h2><p>The real app opens the school's giving page here.</p><button class="btn" data-a="closeSheet">Got it</button>`),
 about:()=>sheet(`<div class="about">${aboutHTML()}</div><button class="btn" data-a="closeSheet">Close</button>`,'about'),
 closeSheet:()=>closeSheet(),
 tour:x=>{closeSheet();
  if(x==='explore'){S.persona='explore';setRoot('explore');return}
  if(S.persona!=='family')S.persona='family';
  if(x==='news'){S.nlKind='all';S.nlQ='';setRoot('news')}
  if(x==='absence'){setRoot('today');ACT.startAbs()}
  if(x==='comfort'){setRoot('today');push('comfort')}
  if(x==='wed'){S.day=2;setRoot('today')}
 }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.x,b)});
document.addEventListener('input',e=>{
 if(e.target.id==='nlSearch'){S.nlQ=e.target.value;$('#nlList').innerHTML=nlList()}
 if(e.target.id==='helpSearch'){S.helpQ=e.target.value;$('#helpList').innerHTML=helpList()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

$('#sideLogo').innerHTML=LOGO;$('#sideAbout').innerHTML=aboutHTML();
applyPrefs();render();
</script>
